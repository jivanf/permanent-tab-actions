name: Publish release

on:
    workflow_dispatch:
        inputs:
            version_type:
                description: Semantic version increment
                required: true
                default: patch
                type: choice
                options: [patch, minor, major]

permissions:
    contents: read

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        if: github.ref == 'refs/heads/main'
        runs-on: blacksmith-2vcpu-ubuntu-2404
        timeout-minutes: 360
        environment: release
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci --ignore-scripts
            - name: Configure release commit
              run: |
                  git config user.name github-actions[bot]
                  git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            - name: Bump version
              id: version
              run: |
                  version=$(node scripts/bump-version.mjs '${{ inputs.version_type }}' | tail -n 1)
                  echo "version=$version" >> "$GITHUB_OUTPUT"
            - name: Validate extension
              run: |
                  npm run check
                  npm test
                  npm run package
                  npm run lint:extension
            - name: Commit release source
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  git add extension/manifest.json package.json package-lock.json
                  git commit -m "release: prepare Permanent Tab Actions $VERSION"
                  git archive --format=zip --output="dist/permanent-tab-actions-$VERSION-source.zip" HEAD
            - name: Submit to Mozilla and wait for approval
              env:
                  AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
                  AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  mkdir -p dist/signed
                  npx --no-install web-ext sign \
                    --source-dir dist/extension \
                    --artifacts-dir dist/signed \
                    --channel unlisted \
                    --api-key "$AMO_JWT_ISSUER" \
                    --api-secret "$AMO_JWT_SECRET" \
                    --upload-source-code "dist/permanent-tab-actions-$VERSION-source.zip" \
                    --approval-timeout 18000000 \
                    --timeout 600000 \
                    --no-input
                  signed=$(find dist/signed -maxdepth 1 -type f -name '*.xpi' -print -quit)
                  test -n "$signed"
                  mv "$signed" "dist/permanent-tab-actions-$VERSION.xpi"
                  unzip -t "dist/permanent-tab-actions-$VERSION.xpi" >/dev/null
                  test "$(unzip -p "dist/permanent-tab-actions-$VERSION.xpi" manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")" = "$VERSION"
            - name: Publish update manifest
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  sha=$(sha256sum "dist/permanent-tab-actions-$VERSION.xpi" | cut -d ' ' -f 1)
                  url="https://github.com/jivanf/permanent-tab-actions/releases/download/v$VERSION/permanent-tab-actions-$VERSION.xpi"
                  node scripts/write-update-manifest.mjs "$VERSION" "$url" "$sha"
                  git add docs/updates.json
                  git commit -m "chore: publish update feed for v$VERSION"
                  test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD~2)"
                  git tag -a "v$VERSION" -m "Permanent Tab Actions $VERSION"
                  git push origin HEAD:main "v$VERSION"
            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  gh release create "v$VERSION" \
                    "dist/permanent-tab-actions-$VERSION.xpi#permanent-tab-actions-$VERSION.xpi" \
                    "dist/permanent-tab-actions-$VERSION.zip#permanent-tab-actions-$VERSION.zip" \
                    "dist/permanent-tab-actions-$VERSION-source.zip#permanent-tab-actions-$VERSION-source.zip" \
                    "docs/updates.json#updates.json" \
                    --title "v$VERSION" \
                    --generate-notes \
                    --verify-tag
